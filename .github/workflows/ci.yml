name: CI

on:
  pull_request:
  push:
    branches: [main, rebuild/ocean]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
  # typecheck and build jobs land with the Phase 0 toolchain upgrade:
  # - typecheck: `tsc --noEmit` once tsconfig is strict and sources are typed
  # - build: `next build` (requires AGILITY_* / ALGOLIA_* repo secrets — see HOSTING.md)
