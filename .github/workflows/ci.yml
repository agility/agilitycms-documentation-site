name: CI

on:
  pull_request:
  push:
    branches: [main, rebuild/ocean]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
  # build/typecheck runs on every Vercel PR deploy (full `next build`).
  # A CI build job would need AGILITY_* / ALGOLIA_* repo secrets — see HOSTING.md.
