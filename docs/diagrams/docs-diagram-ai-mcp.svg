<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Dual-theme. Colours live in CSS, not in presentation attributes, so the
       page's color-scheme drives them: the light values are the default and the
       dark block below wins when the embedding page sets color-scheme: dark
       (app/layout.tsx does this alongside the .dark class). Same file, both themes. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-border{fill:#E4E0D8}
    .f-faint{fill:#6E685E}
    .f-muted{fill:#5E5951}
    .f-pdim{fill:#015B54}
    .f-primary{fill:#027970}
    .f-raised{fill:#FEFDF9}
    .f-secondary{fill:#295BAC}
    .f-surface{fill:#FBF9F3}
    .f-tertiary{fill:#FFCB28}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .f-warn{fill:#836400}
    .s-border{stroke:#E4E0D8}
    .s-bstrong{stroke:#CFC9BC}
    .s-primary{stroke:#027970}
    .s-secondary{stroke:#295BAC}
    .s-warn{stroke:#836400}
    .on-teal{fill:#F1EFE9}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-border{fill:#302E2B}
      .f-faint{fill:#989289}
      .f-muted{fill:#AAA49B}
      .f-pdim{fill:#026F67}
      .f-primary{fill:#028D83}
      .f-raised{fill:#201F1D}
      .f-secondary{fill:#5989D8}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .f-warn{fill:#F2C23E}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-primary{stroke:#028D83}
      .s-secondary{stroke:#5989D8}
      .s-warn{stroke:#F2C23E}
      .on-teal{fill:#F1EFE9}
    }
  </style>
  <rect class="f-bg" width="1200" height="640" rx="4"/>
  <rect class="s-border" x="0.5" y="0.5" width="1199" height="639" rx="4"/>

  <text class="f-muted" x="90" y="52" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4">AI AGENTS — MODEL CONTEXT PROTOCOL → AGILITY</text>

  <!-- AI agent node -->
  <rect class="f-surface" x="90" y="200" width="280" height="240" rx="2"/>
  <rect class="s-border" x="90.5" y="200.5" width="279" height="239" rx="2"/>
  <rect class="f-secondary" x="90" y="200" width="280" height="3"/>
  <text class="f-secondary" x="114" y="248" font-size="24">✦</text>
  <text class="f-text" x="146" y="248" font-size="18" font-weight="600">AI agent</text>
  <text class="f-text2" x="114" y="284" font-size="14">Claude · ChatGPT · Cursor</text>
  <text class="f-text2" x="114" y="306" font-size="14">Copilot · Gemini · your app</text>
  <rect class="f-bg" x="114" y="332" width="232" height="76" rx="2"/>
  <text class="f-muted" x="128" y="358" font-family="ui-monospace, monospace" font-size="12">"Draft a bilingual post</text>
  <text class="f-muted" x="128" y="378" font-family="ui-monospace, monospace" font-size="12"> and stage it for review"</text>

  <!-- connector 1 with OAuth -->
  <path class="s-secondary" d="M370 320 L465 320" stroke-width="2"/>
  <path class="f-secondary" d="M465 320 l-10 -6 v12 z"/>
  <rect class="f-bg s-secondary" x="376" y="270" width="84" height="26" rx="13"/>
  <text class="f-secondary" x="418" y="287" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">OAUTH 2.0</text>

  <!-- MCP server node -->
  <rect class="f-surface" x="465" y="160" width="300" height="320" rx="2"/>
  <rect class="s-bstrong" x="465.5" y="160.5" width="299" height="319" rx="2"/>
  <rect class="f-tertiary" x="465" y="160" width="300" height="3"/>
  <path class="f-tertiary" d="M508 220 l14 -24 14 24 z"/>
  <text class="f-text" x="548" y="218" font-size="18" font-weight="600">MCP server</text>
  <text class="f-muted" x="489" y="248" font-family="ui-monospace, monospace" font-size="12">mcp.agilitycms.com</text>
  <rect class="f-border" x="489" y="270" width="252" height="1"/>
  <text class="f-text2" x="489" y="302" font-family="ui-monospace, monospace" font-size="13">save_content_items()</text>
  <text class="f-text2" x="489" y="328" font-family="ui-monospace, monospace" font-size="13">save_page()</text>
  <text class="f-text2" x="489" y="354" font-family="ui-monospace, monospace" font-size="13">save_content_model()</text>
  <text class="f-text2" x="489" y="380" font-family="ui-monospace, monospace" font-size="13">publish_content()</text>
  <text class="f-faint" x="489" y="406" font-family="ui-monospace, monospace" font-size="13">…full tool reference online</text>
  <rect class="f-raised s-warn" x="489" y="426" width="180" height="28" rx="2"/>
  <text class="f-warn" x="503" y="445" font-family="ui-monospace, monospace" font-size="11">⚑ CONFIRMATION GATES</text>

  <!-- connector 2 -->
  <path class="s-primary" d="M765 320 L860 320" stroke-width="2"/>
  <path class="f-primary" d="M860 320 l-10 -6 v12 z"/>
  <text class="f-faint" x="812" y="300" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">YOUR ROLES</text>
  <text class="f-faint" x="812" y="348" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">YOUR WORKFLOW</text>

  <!-- Instance node -->
  <rect class="f-surface" x="860" y="200" width="250" height="240" rx="2"/>
  <rect class="s-border" x="860.5" y="200.5" width="249" height="239" rx="2"/>
  <rect class="f-primary" x="860" y="200" width="250" height="3"/>
  <text class="f-text" x="884" y="248" font-size="18" font-weight="600">Your instance</text>
  <rect class="f-pdim" x="884" y="272" width="94" height="28" rx="2"/>
  <text class="on-teal" x="931" y="291" text-anchor="middle" font-size="12">Content</text>
  <rect class="f-pdim" x="988" y="272" width="94" height="28" rx="2"/>
  <text class="on-teal" x="1035" y="291" text-anchor="middle" font-size="12">Models</text>
  <rect class="f-pdim" x="884" y="312" width="94" height="28" rx="2"/>
  <text class="on-teal" x="931" y="331" text-anchor="middle" font-size="12">Pages</text>
  <rect class="f-pdim" x="988" y="312" width="94" height="28" rx="2"/>
  <text class="on-teal" x="1035" y="331" text-anchor="middle" font-size="12">Media</text>
  <rect class="f-raised" x="884" y="360" width="198" height="28" rx="2"/>
  <text class="f-text2" x="983" y="379" text-anchor="middle" font-size="12">Staging → Approve → Publish</text>
  <text class="f-muted" x="884" y="418" font-size="13">A human approves the publish.</text>

  <text class="f-faint" x="90" y="606" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">AGILITY CMS · AI &amp; THE MCP SERVER</text>
</svg>
