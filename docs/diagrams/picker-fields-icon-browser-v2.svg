<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">The icon browser, opened as a modal over the content form</title>
  <desc id="d">A modal with a search box for Font Awesome Free icons, Solid, Regular and Brands style filters, and a grid of 24 named icons with star selected. The footer shows the current value solid/star with Clear and Cancel buttons.</desc>
  <!-- Dual-theme (docs convention): colours live in CSS, light is the default,
       the dark block wins when the page sets color-scheme: dark. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-faint{fill:#6E685E}
    .f-muted{fill:#5E5951}
    .f-raised{fill:#FEFDF9}
    .f-scrim{fill:#3B3935}
    .f-surface{fill:#FBF9F3}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .on-fill{fill:#FFFFFF}
    .s-border{stroke:#E4E0D8}
    .s-bstrong{stroke:#CFC9BC}
    .s-text{stroke:#181716}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-faint{fill:#989289}
      .f-muted{fill:#AAA49B}
      .f-raised{fill:#201F1D}
      .f-scrim{fill:#0E0D0C}
      .f-surface{fill:#171615}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .on-fill{fill:#0E0D0C}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-text{stroke:#F1EFE9}
    }
  </style>

	<style>
		.ui { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif; }
		.nm { font-size: 18px; }
	</style>

	<defs>
		<!-- filled glyphs, standing in for Font Awesome Solid -->
		<g id="i-star"><path d="M12 2l2.9 6.26L22 9.27l-5.2 4.87L18.2 21 12 17.6 5.8 21l1.4-6.86L2 9.27l7.1-1.01z"/></g>
		<g id="i-heart"><path d="M12 21s-8-4.9-8-10.3A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8 3.7C20 16.1 12 21 12 21z"/></g>
		<g id="i-house"><path d="M12 3 3 10.2V21h6v-6h6v6h6V10.2z"/></g>
		<g id="i-search"><path d="M10 3a7 7 0 1 0 4.2 12.6l4.6 4.6 1.8-1.8-4.6-4.6A7 7 0 0 0 10 3zm0 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></g>
		<g id="i-user"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></g>
		<g id="i-bell"><path d="M12 2a6 6 0 0 0-6 6c0 5-2 7-2 7h16s-2-2-2-7a6 6 0 0 0-6-6zm0 20a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22z"/></g>
		<g id="i-envelope"><path d="M2 5v14h20V5zm2.2 2h15.6L12 12.4z"/></g>
		<g id="i-calendar"><path d="M7 2v2H4v18h16V4h-3V2h-2v2H9V2zm-1 8h12v10H6z"/></g>
		<g id="i-check"><path d="M9.5 18.2 3.8 12.5l2.1-2.1 3.6 3.6 8.6-8.6 2.1 2.1z"/></g>
		<g id="i-arrow"><path d="M4 11h11.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H4z"/></g>
		<g id="i-camera"><path d="M9 3 7.6 5H4v16h16V5h-3.6L15 3zm3 5.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></g>
		<g id="i-lock"><path d="M12 2a5 5 0 0 0-5 5v3H5v12h14V10h-2V7a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V7a3 3 0 0 1 3-3z"/></g>
		<g id="i-cloud"><path d="M18 19a4.5 4.5 0 0 0 .3-9A6.5 6.5 0 0 0 5.8 11 4 4 0 0 0 6 19z"/></g>
		<g id="i-trash"><path d="M9 2h6l1 2h4v2H4V4h4zm-3 6h12l-1 14H7z"/></g>
		<g id="i-image"><path d="M3 4v16h18V4zm2 2h14v8.5l-4-4-4.5 4.5L9 12l-4 4zm3.5 1.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z"/></g>
		<g id="i-tag"><path d="M2 2h9l11 11-9 9L2 11zm4.5 2.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></g>
		<g id="i-gear"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-1.5-6h3l.4 2.6 2.3 1 2.2-1.4 2.1 2.1-1.4 2.2 1 2.3 2.6.4v3l-2.6.4-1 2.3 1.4 2.2-2.1 2.1-2.2-1.4-2.3 1-.4 2.6h-3l-.4-2.6-2.3-1-2.2 1.4-2.1-2.1 1.4-2.2-1-2.3L2 13.5v-3l2.6-.4 1-2.3L4.2 5.6l2.1-2.1 2.2 1.4 2.3-1z"/></g>
		<g id="i-bookmark"><path d="M6 2h12v20l-6-4.5L6 22z"/></g>
		<g id="i-clock"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.3l4 2.4-1 1.7-5-3V7z"/></g>
		<g id="i-pin"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 4.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></g>
		<g id="i-play"><path d="M6 3l14 9-14 9z"/></g>
		<g id="i-download"><path d="M11 3h2v9h4l-5 5-5-5h4zm-6 15h14v3H5z"/></g>
		<g id="i-cart"><path d="M2 3h3l3 12h11v2H6.5L3 5H2zm6 16a1.8 1.8 0 1 0 0 3.6A1.8 1.8 0 0 0 8 19zm10 0a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM8.4 6H21l-2 7H10z"/></g>
		<g id="i-thumb"><path d="M2 10h4v11H2zm6 0 4-8c1.7 0 2.7 1.2 2.4 2.7L13.8 9H20c1.2 0 2.2 1.1 1.9 2.3l-1.8 8c-.2 1-1 1.7-2 1.7H8z"/></g>
	</defs>

	<!-- the host, dimmed behind the modal -->
	<rect class="f-scrim" width="1600" height="1000" />

	<rect class="f-raised" x="160" y="80" width="1280" height="840" rx="20" />

	<!-- header: search, then the style filter -->
	<g class="ui">
		<rect class="f-raised s-bstrong" x="200" y="124" width="1200" height="76" rx="12" stroke-width="2" />
		<g class="f-faint" transform="translate(228 148) scale(1.7)">
			<use href="#i-search" />
		</g>
		<text class="f-faint" x="278" y="171" font-size="26">Search 2,883 Font Awesome Free icons…</text>

		<rect class="f-text" x="200" y="222" width="106" height="44" rx="22" />
		<text class="on-fill" x="253" y="251" font-size="21" font-weight="500" text-anchor="middle">Solid</text>
		<rect class="f-bg" x="316" y="222" width="126" height="44" rx="22" />
		<text class="f-text2" x="379" y="251" font-size="21" font-weight="500" text-anchor="middle">Regular</text>
		<rect class="f-bg" x="452" y="222" width="118" height="44" rx="22" />
		<text class="f-text2" x="511" y="251" font-size="21" font-weight="500" text-anchor="middle">Brands</text>
	</g>
	<line class="s-border" x1="160" y1="292" x2="1440" y2="292" stroke-width="2" />

	<!-- the grid -->
	<g class="ui f-text">
		<!-- row 1 -->
		<rect class="f-raised s-text" x="202" y="316" width="138" height="138" rx="12" stroke-width="3" />
		<g transform="translate(247 342) scale(2)"><use href="#i-star" /></g>
		<text x="271" y="432" class="nm f-text2" text-anchor="middle">star</text>

		<g transform="translate(398 342) scale(2)"><use href="#i-heart" /></g>
		<text x="422" y="432" class="nm f-muted" text-anchor="middle">heart</text>
		<g transform="translate(549 342) scale(2)"><use href="#i-house" /></g>
		<text x="573" y="432" class="nm f-muted" text-anchor="middle">house</text>
		<g transform="translate(700 342) scale(2)"><use href="#i-search" /></g>
		<text x="724" y="432" class="nm f-muted" text-anchor="middle">magnifying-glass</text>
		<g transform="translate(851 342) scale(2)"><use href="#i-user" /></g>
		<text x="875" y="432" class="nm f-muted" text-anchor="middle">user</text>
		<g transform="translate(1002 342) scale(2)"><use href="#i-bell" /></g>
		<text x="1026" y="432" class="nm f-muted" text-anchor="middle">bell</text>
		<g transform="translate(1153 342) scale(2)"><use href="#i-envelope" /></g>
		<text x="1177" y="432" class="nm f-muted" text-anchor="middle">envelope</text>
		<g transform="translate(1304 342) scale(2)"><use href="#i-calendar" /></g>
		<text x="1328" y="432" class="nm f-muted" text-anchor="middle">calendar</text>

		<!-- row 2 -->
		<g transform="translate(247 493) scale(2)"><use href="#i-check" /></g>
		<text x="271" y="583" class="nm f-muted" text-anchor="middle">check</text>
		<g transform="translate(398 493) scale(2)"><use href="#i-arrow" /></g>
		<text x="422" y="583" class="nm f-muted" text-anchor="middle">arrow-right</text>
		<g transform="translate(549 493) scale(2)"><use href="#i-camera" /></g>
		<text x="573" y="583" class="nm f-muted" text-anchor="middle">camera</text>
		<g transform="translate(700 493) scale(2)"><use href="#i-lock" /></g>
		<text x="724" y="583" class="nm f-muted" text-anchor="middle">lock</text>
		<g transform="translate(851 493) scale(2)"><use href="#i-cloud" /></g>
		<text x="875" y="583" class="nm f-muted" text-anchor="middle">cloud</text>
		<g transform="translate(1002 493) scale(2)"><use href="#i-trash" /></g>
		<text x="1026" y="583" class="nm f-muted" text-anchor="middle">trash</text>
		<g transform="translate(1153 493) scale(2)"><use href="#i-image" /></g>
		<text x="1177" y="583" class="nm f-muted" text-anchor="middle">image</text>
		<g transform="translate(1304 493) scale(2)"><use href="#i-tag" /></g>
		<text x="1328" y="583" class="nm f-muted" text-anchor="middle">tag</text>

		<!-- row 3 -->
		<g transform="translate(247 644) scale(2)"><use href="#i-gear" /></g>
		<text x="271" y="734" class="nm f-muted" text-anchor="middle">gear</text>
		<g transform="translate(398 644) scale(2)"><use href="#i-bookmark" /></g>
		<text x="422" y="734" class="nm f-muted" text-anchor="middle">bookmark</text>
		<g transform="translate(549 644) scale(2)"><use href="#i-clock" /></g>
		<text x="573" y="734" class="nm f-muted" text-anchor="middle">clock</text>
		<g transform="translate(700 644) scale(2)"><use href="#i-pin" /></g>
		<text x="724" y="734" class="nm f-muted" text-anchor="middle">location-dot</text>
		<g transform="translate(851 644) scale(2)"><use href="#i-play" /></g>
		<text x="875" y="734" class="nm f-muted" text-anchor="middle">play</text>
		<g transform="translate(1002 644) scale(2)"><use href="#i-download" /></g>
		<text x="1026" y="734" class="nm f-muted" text-anchor="middle">download</text>
		<g transform="translate(1153 644) scale(2)"><use href="#i-cart" /></g>
		<text x="1177" y="734" class="nm f-muted" text-anchor="middle">cart-shopping</text>
		<g transform="translate(1304 644) scale(2)"><use href="#i-thumb" /></g>
		<text x="1328" y="734" class="nm f-muted" text-anchor="middle">thumbs-up</text>
	</g>

	<!-- footer -->
	<path class="f-surface" d="M160 800h1280v100a20 20 0 0 1-20 20H180a20 20 0 0 1-20-20z" />
	<line class="s-border" x1="160" y1="800" x2="1440" y2="800" stroke-width="2" />
	<g class="ui">
		<g class="f-text2" transform="translate(200 844) scale(1.4)"><use href="#i-star" /></g>
		<text class="f-muted" x="242" y="869" font-size="23">Currently <tspan class="f-text2" font-weight="600">solid/star</tspan></text>

		<text class="f-muted" x="1197" y="869" font-size="24" font-weight="500" text-anchor="middle">Clear</text>
		<rect class="f-raised s-bstrong" x="1252" y="838" width="148" height="56" rx="10" stroke-width="2" />
		<text class="f-text2" x="1326" y="875" font-size="24" font-weight="500" text-anchor="middle">Cancel</text>
	</g>
</svg>
