<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two CDNs, two owners, two cache scopes</title>
  <desc id="d">A two-CDN-layer architecture with two owners. In the customer-owned band, end-user browsers hit the customer's own CDN (e.g. Vercel, Netlify, Azure Front Door or Cloudflare) which serves rendered pages and front-end assets, backed by the customer application or static site. Across the ownership boundary, the Agility-owned band holds Agility's global Fastly CDN serving cached content-API responses and the asset CDN, with the Agility content platform on Microsoft Azure as origin, reached only on a cache miss. Each layer controls its own cache invalidation.</desc>
  <!-- Dual-theme (docs convention): colours live in CSS, light is the default,
       the dark block wins when the page sets color-scheme: dark. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-border{fill:#E4E0D8}
    .f-bstrong{fill:#CFC9BC}
    .f-faint{fill:#6E685E}
    .f-muted{fill:#5E5951}
    .f-ok{fill:#1A6E36}
    .f-raised{fill:#FEFDF9}
    .f-surface{fill:#FBF9F3}
    .f-tertiary{fill:#FFCB28}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .on-fill{fill:#FFFFFF}
    .on-fill-muted{fill:#AAA49B}
    .on-yellow{fill:#0E0D0C}
    .s-border{stroke:#E4E0D8}
    .s-bstrong{stroke:#CFC9BC}
    .s-muted{stroke:#5E5951}
    .s-ok{stroke:#1A6E36}
    .s-tertiary{stroke:#FFCB28}
    .s-text{stroke:#181716}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-border{fill:#302E2B}
      .f-bstrong{fill:#45423E}
      .f-faint{fill:#989289}
      .f-muted{fill:#AAA49B}
      .f-ok{fill:#79C06B}
      .f-raised{fill:#201F1D}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .on-fill{fill:#0E0D0C}
      .on-fill-muted{fill:#5E5951}
      .on-yellow{fill:#0E0D0C}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-muted{stroke:#AAA49B}
      .s-ok{stroke:#79C06B}
      .s-tertiary{stroke:#FFCB28}
      .s-text{stroke:#F1EFE9}
    }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle class="f-text" cx="1" cy="1" r="1" opacity="0.10"></circle></pattern>
    <marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="f-text" d="M0,0 L10,5 L0,10 z"></path></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="f-ok" d="M0,0 L10,5 L0,10 z"></path></marker>
  </defs>

  <rect class="f-bg" width="1200" height="720"></rect>
  <rect width="1200" height="720" fill="url(#dots)"></rect>
  <rect class="s-border" x="0.5" y="0.5" width="1199" height="719" fill="none" rx="18"></rect>

  <text class="f-faint" x="32" y="34" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">FIG. — TWO-CDN-LAYER ARCHITECTURE</text>
  <text class="f-text" x="32" y="76" font-size="27" font-weight="600" letter-spacing="-0.5">Two CDNs, two owners, two cache scopes.</text>
  <text class="f-muted" x="32" y="100" font-size="13.5">The customer&#39;s CDN sits in front of the app; Agility&#39;s Fastly CDN sits in front of content and assets.</text>

  
  <rect class="f-surface s-bstrong" x="32" y="132" width="660" height="372" rx="14"></rect>
  <rect class="f-surface s-tertiary" x="712" y="132" width="456" height="372" rx="14"></rect>

  <g transform="translate(48,154)">
    <rect class="f-bstrong" x="0" y="0" width="10" height="10" rx="2"></rect>
    <text class="f-text2" x="18" y="9" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.2">CUSTOMER-OWNED LAYER</text>
  </g>
  <g transform="translate(728,154)">
    <rect class="f-tertiary s-text" x="0" y="0" width="10" height="10" rx="2"></rect>
    <text class="f-text2" x="18" y="9" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.2">AGILITY-OWNED LAYER</text>
  </g>

  
  <line class="s-text" x1="702" y1="132" x2="702" y2="504" stroke-width="1.5" stroke-dasharray="6 5"></line>
  <rect class="f-text" x="640" y="120" width="124" height="24" rx="12"></rect>
  <text class="on-fill" x="702" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.2">OWNERSHIP LINE</text>

  
  <g>
    
    <path class="s-text" d="M182 296 L218 282" fill="none" stroke-width="1.5" marker-end="url(#ai)"></path>
    
    <path class="s-ok" d="M218 330 L186 336" fill="none" stroke-width="2.6" marker-end="url(#ag)"></path>
    
    <path class="s-text" d="M454 312 L490 312" fill="none" stroke-width="1.5" marker-end="url(#ai)"></path>
    
    <path class="s-text" d="M670 312 L728 308" fill="none" stroke-width="1.5" marker-end="url(#ai)"></path>
    
    <path class="s-text" d="M1000 318 L1022 340" fill="none" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ai)"></path>
  </g>

  
  <g transform="translate(52,255)">
    <rect class="f-raised s-text" x="0" y="0" width="130" height="100" rx="10" stroke-width="1.5"></rect>
    <text class="f-muted" x="14" y="24" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.2">CLIENT</text>
    <text class="f-text" x="14" y="48" font-size="14.5" font-weight="600" letter-spacing="-0.2">End-user</text>
    <text class="f-text" x="14" y="66" font-size="14.5" font-weight="600" letter-spacing="-0.2">browsers</text>
    <g class="s-muted" transform="translate(14,78)" fill="none" stroke-width="1.5">
      <rect x="0" y="0" width="20" height="15" rx="3"></rect><line x1="6" y1="19" x2="14" y2="19"></line>
      <rect x="28" y="0" width="20" height="15" rx="3"></rect><line x1="34" y1="19" x2="42" y2="19"></line>
      <rect x="56" y="0" width="20" height="15" rx="3"></rect><line x1="62" y1="19" x2="70" y2="19"></line>
    </g>
  </g>

  
  <g transform="translate(222,210)">
    <rect class="f-raised s-text" x="0" y="0" width="232" height="200" rx="10" stroke-width="1.5"></rect>
    <text class="f-muted" x="16" y="26" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.2">CUSTOMER FRONT-END CDN</text>
    <text class="f-text" x="16" y="52" font-size="17" font-weight="600" letter-spacing="-0.3">Customer&#39;s CDN</text>
    <text class="f-muted" x="16" y="74" font-family="JetBrains Mono, monospace" font-size="10">e.g. Vercel / Netlify /</text>
    <text class="f-muted" x="16" y="88" font-family="JetBrains Mono, monospace" font-size="10">Azure Front Door / Cloudflare</text>
    <rect class="f-surface s-bstrong" x="16" y="100" width="200" height="42" rx="8"></rect>
    <text class="f-text2" x="28" y="119" font-family="JetBrains Mono, monospace" font-size="9.5">SERVES</text>
    <text class="f-text" x="28" y="134" font-size="12.5" font-weight="600">Rendered pages + front-end assets</text>
    <rect class="f-border s-bstrong" x="16" y="156" width="200" height="26" rx="13"></rect>
    <text class="f-text2" x="116" y="173" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="0.8">OWNED BY CUSTOMER / PARTNER</text>
  </g>

  
  <g transform="translate(494,265)">
    <rect class="f-raised s-text" x="0" y="0" width="176" height="94" rx="10" stroke-width="1.5"></rect>
    <text class="f-muted" x="14" y="24" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.2">BUILD / RUNTIME</text>
    <text class="f-text" x="14" y="48" font-size="14" font-weight="600" letter-spacing="-0.2">Customer app /</text>
    <text class="f-text" x="14" y="65" font-size="14" font-weight="600" letter-spacing="-0.2">static site</text>
    <text class="f-muted" x="14" y="84" font-family="JetBrains Mono, monospace" font-size="9.5">Fetches at build / revalidation</text>
  </g>

  
  <g transform="translate(732,205)">
    <rect class="f-raised s-text" x="0" y="0" width="268" height="212" rx="10" stroke-width="2"></rect>
    <path class="f-tertiary" d="M268 0 L268 16 L252 0 Z"></path>
    <text class="f-muted" x="16" y="26" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.2">AGILITY GLOBAL CDN · FASTLY</text>
    <rect class="f-surface s-tertiary" x="16" y="36" width="236" height="44" rx="8"></rect>
    <text class="f-text" x="28" y="55" font-size="13" font-weight="600" letter-spacing="-0.1">Content APIs · Fetch / GraphQL</text>
    <text class="f-muted" x="28" y="71" font-family="JetBrains Mono, monospace" font-size="9.5">Cached responses</text>
    <rect class="f-surface s-tertiary" x="16" y="88" width="236" height="44" rx="8"></rect>
    <text class="f-text" x="28" y="107" font-size="13" font-weight="600" letter-spacing="-0.1">Asset CDN · cdn.aglty.io</text>
    <text class="f-muted" x="28" y="123" font-family="JetBrains Mono, monospace" font-size="9.5">Images / files + transforms</text>
    <rect class="f-tertiary s-text" x="16" y="146" width="236" height="26" rx="13"></rect>
    <text class="on-yellow" x="134" y="163" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1">OPERATED BY AGILITY</text>
    <text class="f-muted" x="16" y="192" font-family="JetBrains Mono, monospace" font-size="9.5">Independent cache · own invalidation</text>
  </g>

  
  <g transform="translate(1024,308)">
    <rect class="f-text" x="0" y="0" width="128" height="92" rx="10"></rect>
    <text class="on-fill-muted" x="14" y="24" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.2">ORIGIN</text>
    <text class="on-fill" x="14" y="47" font-size="13.5" font-weight="600" letter-spacing="-0.2">Agility content</text>
    <text class="on-fill" x="14" y="64" font-size="13.5" font-weight="600" letter-spacing="-0.2">platform</text>
    <text class="on-fill-muted" x="14" y="83" font-family="JetBrains Mono, monospace" font-size="9">on Microsoft Azure</text>
  </g>

  
  <g font-family="JetBrains Mono, monospace" font-size="10">
    <rect class="f-ok" x="40" y="364" width="156" height="22" rx="11"></rect>
    <text class="on-fill" x="118" y="379" text-anchor="middle" font-weight="600">Cache hit at edge</text>
    <rect class="f-raised s-border" x="652" y="282" width="98" height="20" rx="10"></rect>
    <text class="f-muted" x="701" y="296" text-anchor="middle">content fetch</text>
    <rect class="f-raised s-bstrong" x="1004" y="284" width="132" height="20" rx="10" stroke-dasharray="4 3"></rect>
    <text class="f-muted" x="1070" y="298" text-anchor="middle">only on cache miss</text>
  </g>

  
  <g transform="translate(744,170)">
    <rect class="f-text" x="0" y="0" width="262" height="26" rx="13"></rect>
    <circle class="f-tertiary" cx="16" cy="13" r="4"></circle>
    <text class="on-fill" x="28" y="17" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="0.3">Instant cache invalidation on publish</text>
  </g>
  <g transform="translate(732,432)">
    <rect class="f-surface s-tertiary" x="0" y="0" width="316" height="28" rx="9"></rect>
    <text class="f-text" x="14" y="18" font-family="JetBrains Mono, monospace" font-size="10"><tspan font-weight="600">Cached API responses</tspan> don&#39;t count toward rate limits</text>
  </g>

  
  <line class="s-border" x1="32" y1="556" x2="1168" y2="556" stroke-dasharray="4 4"></line>
  <g class="f-muted" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.6">
    <rect class="f-surface s-bstrong" x="34" y="588" width="14" height="14" rx="3"></rect>
    <text x="56" y="599">CUSTOMER-OWNED</text>
    <rect class="f-surface s-tertiary" x="248" y="588" width="14" height="14" rx="3"></rect>
    <text x="270" y="599">AGILITY-OWNED</text>
    <line class="s-ok" x1="462" y1="595" x2="486" y2="595" stroke-width="2.6"></line>
    <text x="494" y="599">CACHE HIT · SERVED AT EDGE</text>
    <line class="s-text" x1="730" y1="595" x2="754" y2="595" stroke-width="1.4" stroke-dasharray="5 4"></line>
    <text x="762" y="599">ORIGIN CALL · ON MISS ONLY</text>
    <text class="f-faint" x="1166" y="640" text-anchor="end" font-style="italic">Independent caches — each layer controls its own invalidation.</text>
  </g>
</svg>