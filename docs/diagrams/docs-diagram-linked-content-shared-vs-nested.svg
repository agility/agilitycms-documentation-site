    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-muted{fill:#AAA49B}
      .f-primary{fill:#028D83}
      .f-raised{fill:#201F1D}
      .f-secondary{fill:#5989D8}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-primary{stroke:#028D83}
      .s-secondary{stroke:#5989D8}
      .s-tertiary{stroke:#FFCB28}
      .s-muted{stroke:#AAA49B}
      .on-fill{fill:#0E0D0C}
      .s-onfill{stroke:#0E0D0C}
    }
  </style>
