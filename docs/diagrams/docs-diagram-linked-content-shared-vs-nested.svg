  <circle class="f-tertiary" cx="666" cy="446" r="4"/>
  <text class="f-text2" x="682" y="450" font-size="14">Content belongs to one parent</text>
  <circle class="f-tertiary" cx="666" cy="474" r="4"/>
  <text class="f-text2" x="682" y="478" font-size="14">Cannot be shared with other items</text>
