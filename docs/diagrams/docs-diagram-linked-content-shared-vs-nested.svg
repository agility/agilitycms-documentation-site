  <text class="f-text" x="100" y="612" font-size="13" font-weight="600">Common use cases</text>
  <text class="f-text2" x="100" y="636" font-size="13">Authors · Categories · Tags · Products</text>
  <text class="f-text2" x="100" y="655" font-size="13">Locations · Team members</text>

  <!-- Nested content -->
