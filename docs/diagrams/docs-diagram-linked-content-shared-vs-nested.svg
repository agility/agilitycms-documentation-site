  <rect class="s-border" x="650.5" y="584.5" width="489" height="79" rx="2"/>
  <rect class="f-tertiary" x="650" y="584" width="3" height="80"/>
  <text class="f-text" x="670" y="612" font-size="13" font-weight="600">Common use cases</text>
  <text class="f-text2" x="670" y="636" font-size="13">Product variants · Carousel slides · FAQ items</text>
  <text class="f-text2" x="670" y="655" font-size="13">Accordion sections · Timeline events</text>

  <!-- When to use -->
  <rect class="f-raised" x="120" y="710" width="960" height="100" rx="2"/>
  <rect class="s-bstrong" x="120.5" y="710.5" width="959" height="99" rx="2"/>
  <path class="s-border" d="M600 726 V794" stroke-width="1"/>
  <text class="f-secondary" x="360" y="742" text-anchor="middle" font-size="14" font-weight="600">When to use shared content</text>
  <text class="f-text2" x="360" y="766" text-anchor="middle" font-size="13">Content needs to be reused across multiple items</text>
  <text class="f-text2" x="360" y="786" text-anchor="middle" font-size="13">Updates should show everywhere it is used</text>
  <text class="f-primary" x="840" y="742" text-anchor="middle" font-size="14" font-weight="600">When to use nested content</text>
