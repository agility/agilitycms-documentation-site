<svg width="1200" height="840" viewBox="0 0 1200 840" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Linked content: shared vs nested</title>
  <desc id="d">Shared content: multiple items reference the same content. Three blog posts each link to an author in one shared authors list, and two posts point at the same author. The content exists independently, can be referenced by many items, changes reflect everywhere, and deleting a parent keeps the shared content. Common uses: authors, categories, tags, products, locations, team members. Nested content: each parent owns its unique children. A T-shirt product has its own red variants, a hoodie has its own black variants, and a homepage carousel has its own slides. The content belongs to one parent, cannot be shared, and is deleted with the parent. Common uses: product variants, carousel slides, FAQ items, accordion sections, timeline events.</desc>
