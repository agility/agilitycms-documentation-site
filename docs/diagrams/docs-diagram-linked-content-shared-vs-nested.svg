  <text class="f-muted" x="340" y="282" font-family="ui-monospace, monospace" font-size="10">SAME AUTHOR</text>
  <circle class="f-secondary" cx="96" cy="446" r="4"/>
  <text class="f-text2" x="112" y="450" font-size="14">Content exists independently</text>
  <circle class="f-secondary" cx="96" cy="474" r="4"/>
  <text class="f-text2" x="112" y="478" font-size="14">Can be referenced by many items</text>
  <circle class="f-secondary" cx="96" cy="502" r="4"/>
  <text class="f-text2" x="112" y="506" font-size="14">Changes reflect everywhere</text>
  <circle class="f-secondary" cx="96" cy="530" r="4"/>
  <text class="f-text2" x="112" y="534" font-size="14">Deleting a parent keeps the shared content</text>
  <rect class="f-surface" x="80" y="584" width="490" height="80" rx="2"/>
  <rect class="s-border" x="80.5" y="584.5" width="489" height="79" rx="2"/>
