  <text class="f-text" x="1022.5" y="176" text-anchor="middle" font-size="15" font-weight="600">Product: Hoodie</text>
  <rect class="f-raised" x="923" y="192" width="199" height="32" rx="2"/>
  <rect class="s-border" x="923.5" y="192.5" width="198" height="31" rx="2"/>
  <text class="f-text2" x="1022.5" y="213" text-anchor="middle" font-size="12.5">Variant: Black / Medium</text>
