<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a page is built in Agility CMS</title>
  <desc id="d">A page holds page-level properties such as name, URL and SEO. Each page uses a page model, and the page model defines the zones on the page. Editors add, remove and re-order components inside each zone, choosing from the component models your developers have built. Components render in the order they appear in the zone.</desc>
  <!-- Dual-theme, same convention as docs-diagram-headless-architecture.svg: colours live in CSS,
       light is the default, the dark block wins when the page sets color-scheme: dark. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-muted{fill:#5E5951}
    .f-primary{fill:#027970}
    .f-raised{fill:#FEFDF9}
    .f-secondary{fill:#295BAC}
    .f-surface{fill:#FBF9F3}
    .f-tertiary{fill:#FFCB28}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .s-border{stroke:#E4E0D8}
    .s-bstrong{stroke:#CFC9BC}
    .s-primary{stroke:#027970}
    .s-secondary{stroke:#295BAC}
    .s-tertiary{stroke:#FFCB28}
    .s-muted{stroke:#5E5951}
    .on-fill{fill:#FEFDF9}
    .s-onfill{stroke:#FEFDF9}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-muted{fill:#AAA49B}
      .f-primary{fill:#028D83}
      .f-raised{fill:#201F1D}
      .f-secondary{fill:#5989D8}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-primary{stroke:#028D83}
      .s-secondary{stroke:#5989D8}
      .s-tertiary{stroke:#FFCB28}
      .s-muted{stroke:#AAA49B}
      .on-fill{fill:#0E0D0C}
      .s-onfill{stroke:#0E0D0C}
    }
  </style>
  <rect class="f-bg" width="1200" height="620" rx="4"/>
  <rect class="s-border" x="0.5" y="0.5" width="1199" height="619" rx="4"/>
  <text class="f-muted" x="60" y="44" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4">PAGE STRUCTURE: PAGE → PAGE MODEL → ZONES → COMPONENTS</text>

  <!-- Page -->
  <rect class="f-surface" x="60" y="76" width="720" height="504" rx="2"/>
  <rect class="s-bstrong" x="60.5" y="76.5" width="719" height="503" rx="2"/>
  <rect class="f-primary" x="60" y="76" width="720" height="3"/>
  <text class="f-text" x="84" y="112" font-size="18" font-weight="600">Page</text>
  <text class="f-text2" x="84" y="136" font-size="13">Name · URL · SEO · menu text · other page properties</text>

  <!-- Page model -->
  <rect class="f-raised" x="84" y="156" width="672" height="400" rx="2"/>
  <rect class="s-border" x="84.5" y="156.5" width="671" height="399" rx="2"/>
  <rect class="f-secondary" x="84" y="156" width="672" height="3"/>
  <text class="f-text" x="108" y="190" font-size="16" font-weight="600">Page model</text>
  <text class="f-text2" x="222" y="190" font-size="13">defines which zones the page has</text>

  <!-- Zones and the components editors placed in them -->
  <rect class="f-surface" x="108" y="210" width="400" height="322" rx="2"/>
  <rect class="s-bstrong" x="108.5" y="210.5" width="399" height="321" rx="2" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text class="f-muted" x="126" y="238" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">ZONE: MAIN</text>
  <rect class="f-raised" x="128" y="252" width="360" height="64" rx="2"/>
  <rect class="s-border" x="128.5" y="252.5" width="359" height="63" rx="2"/>
  <rect class="f-tertiary" x="128" y="252" width="3" height="64"/>
  <text class="f-muted" x="148" y="279" font-family="ui-monospace, monospace" font-size="11">1</text>
  <text class="f-text" x="172" y="279" font-size="15" font-weight="600">Hero</text>
  <text class="f-text2" x="172" y="300" font-size="12">Component · heading, image, button</text>
  <rect class="f-raised" x="128" y="330" width="360" height="64" rx="2"/>
  <rect class="s-border" x="128.5" y="330.5" width="359" height="63" rx="2"/>
  <rect class="f-tertiary" x="128" y="330" width="3" height="64"/>
  <text class="f-muted" x="148" y="357" font-family="ui-monospace, monospace" font-size="11">2</text>
  <text class="f-text" x="172" y="357" font-size="15" font-weight="600">Rich Text Area</text>
  <text class="f-text2" x="172" y="378" font-size="12">Component · formatted text</text>
  <rect class="f-raised" x="128" y="408" width="360" height="64" rx="2"/>
  <rect class="s-border" x="128.5" y="408.5" width="359" height="63" rx="2"/>
  <rect class="f-tertiary" x="128" y="408" width="3" height="64"/>
  <text class="f-muted" x="148" y="435" font-family="ui-monospace, monospace" font-size="11">3</text>
  <text class="f-text" x="172" y="435" font-size="15" font-weight="600">Posts Listing</text>
  <text class="f-text2" x="172" y="456" font-size="12">Component · links to a posts list</text>
  <text class="f-muted" x="128" y="510" font-size="12">Rendered top to bottom, in this order</text>
  <rect class="f-surface" x="528" y="210" width="208" height="322" rx="2"/>
  <rect class="s-bstrong" x="528.5" y="210.5" width="207" height="321" rx="2" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text class="f-muted" x="546" y="238" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">ZONE: SIDEBAR</text>
  <rect class="f-raised" x="546" y="252" width="172" height="64" rx="2"/>
  <rect class="s-border" x="546.5" y="252.5" width="171" height="63" rx="2"/>
  <rect class="f-tertiary" x="546" y="252" width="3" height="64"/>
  <text class="f-muted" x="566" y="279" font-family="ui-monospace, monospace" font-size="11">1</text>
  <text class="f-text" x="590" y="279" font-size="15" font-weight="600">Call to Action</text>
  <text class="f-text2" x="590" y="300" font-size="12">Component</text>

  <!-- Component models library -->
  <rect class="f-surface" x="860" y="156" width="280" height="376" rx="2"/>
  <rect class="s-border" x="860.5" y="156.5" width="279" height="375" rx="2"/>
  <rect class="f-tertiary" x="860" y="156" width="280" height="3"/>
  <text class="f-text" x="884" y="192" font-size="16" font-weight="600">Component models</text>
  <text class="f-text2" x="884" y="214" font-size="13">Built by developers</text>
  <rect class="f-raised" x="884" y="236" width="232" height="40" rx="2"/>
  <rect class="s-border" x="884.5" y="236.5" width="231" height="39" rx="2"/>
  <rect class="f-tertiary" x="900" y="252" width="8" height="8"/>
  <text class="f-text" x="920" y="261" font-size="14">Hero</text>
  <rect class="f-raised" x="884" y="288" width="232" height="40" rx="2"/>
  <rect class="s-border" x="884.5" y="288.5" width="231" height="39" rx="2"/>
  <rect class="f-tertiary" x="900" y="304" width="8" height="8"/>
  <text class="f-text" x="920" y="313" font-size="14">Rich Text Area</text>
  <rect class="f-raised" x="884" y="340" width="232" height="40" rx="2"/>
  <rect class="s-border" x="884.5" y="340.5" width="231" height="39" rx="2"/>
  <rect class="f-tertiary" x="900" y="356" width="8" height="8"/>
  <text class="f-text" x="920" y="365" font-size="14">Posts Listing</text>
  <rect class="f-raised" x="884" y="392" width="232" height="40" rx="2"/>
  <rect class="s-border" x="884.5" y="392.5" width="231" height="39" rx="2"/>
  <rect class="f-tertiary" x="900" y="408" width="8" height="8"/>
  <text class="f-text" x="920" y="417" font-size="14">Call to Action</text>
  <text class="f-text2" x="884" y="466" font-size="13">Editors add, remove and</text>
  <text class="f-text2" x="884" y="485" font-size="13">re-order them in any zone</text>
  <text class="f-text2" x="884" y="504" font-size="13">the page model allows.</text>

  <!-- Editors place components into zones -->
  <path class="s-primary" d="M860 330 H748" stroke-width="2"/>
  <path class="f-primary" d="M738 330 l10 -6 v12 z"/>
  <rect class="f-bg s-primary" x="797.5" y="297" width="41" height="22" rx="11"/>
  <text class="f-primary" x="818" y="312" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">ADD</text>
  <text class="f-muted" x="60" y="606" font-size="12">The Fetch API returns the page with its zones, each holding its components in order. Your site renders each one.</text>
</svg>
