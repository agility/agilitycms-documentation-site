    <rect class="f-secondary" x="14" y="10" width="44" height="22" rx="4"></rect>
    <text class="on-fill" x="36" y="25" text-anchor="middle" font-size="11" font-weight="700">TAB</text>
    <text class="f-secondary" x="70" y="26" font-size="14" font-weight="600">FAQ</text>
    <rect class="f-surface s-secondary" x="346" y="10" width="72" height="22" rx="11"></rect>
    <text class="f-secondary" x="382" y="25" text-anchor="middle" font-size="10">Label field</text>
  </g>
  <g transform="translate(62,562)">
