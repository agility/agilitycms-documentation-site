    <text class="f-text2" x="40" y="22" font-size="12.5" font-weight="600">Accordion</text>
    <rect class="f-border" x="300" y="14" width="114" height="6" rx="3"></rect>
  </g>

  
  <g transform="translate(62,614)">
    <rect class="f-raised s-bstrong" width="426" height="40" rx="7" stroke-dasharray="5 4"></rect>
    <text class="f-muted" x="213" y="25" text-anchor="middle" font-size="11.5">+  Add another Tab component to start the next tab</text>
  </g>

  
  <g transform="translate(0,0)">
    <line class="s-faint" x1="514" y1="372" x2="556" y2="372" stroke-width="1.6" marker-end="url(#tcArrow)"></line>
    <text class="f-muted" x="535" y="360" text-anchor="middle" font-size="11" font-weight="600">renders as</text>
  </g>

  
