<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 772" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Tab Component pattern</title>
  <desc id="d">The Tab Component pattern: a linear list of components in the editor renders as grouped tabbed sections on the page. Each Tab component starts a new tab and carries its label.</desc>
