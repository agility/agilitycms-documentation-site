  <rect class="f-bg s-border" x="618" y="356" width="232" height="150" rx="6"></rect>
  <circle class="f-bstrong" cx="668" cy="402" r="14"></circle>
  <path class="f-bstrong" d="M636 484 L692 432 L724 464 L760 424 L832 484 Z"></path>
  <text class="f-faint" x="734" y="498" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="0.5">IMAGE</text>

  
  <rect class="f-raised s-border" x="870" y="356" width="224" height="150" rx="6"></rect>
