      <path class="f-faint" d="M0,0 L10,5 L0,10 z"></path>
    </marker>
  </defs>

  <rect class="f-surface" width="1180" height="772"></rect>

  
  <text class="f-text" x="40" y="42" font-size="23" font-weight="700" letter-spacing="-0.3">The Tab Component pattern</text>
  <text class="f-muted" x="40" y="66" font-size="13.5">One linear list of components in the editor → grouped tabbed sections on the rendered page.</text>

  
