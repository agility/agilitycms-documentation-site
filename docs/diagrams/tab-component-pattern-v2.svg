  <text class="f-faint" x="594" y="122" font-size="11" font-weight="700" letter-spacing="1.5">RENDERED PAGE</text>
  <text class="f-faint" x="1118" y="122" text-anchor="end" font-size="11">one tab per Tab component</text>

  
  <rect class="f-surface s-border" x="594" y="140" width="524" height="50" rx="9"></rect>
