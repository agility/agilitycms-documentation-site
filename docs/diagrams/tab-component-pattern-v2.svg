  <g transform="translate(62,342)">
    <rect class="f-raised s-secondary" width="426" height="42" rx="7" stroke-width="1.5"></rect>
    <rect class="f-secondary" x="0" y="0" width="5" height="42" rx="2.5"></rect>
    <rect class="f-secondary" x="14" y="10" width="44" height="22" rx="4"></rect>
    <text class="on-fill" x="36" y="25" text-anchor="middle" font-size="11" font-weight="700">TAB</text>
