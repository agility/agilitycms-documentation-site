  <rect class="f-bstrong" x="888" y="408" width="150" height="10" rx="4"></rect>
  <rect class="f-border" x="888" y="428" width="188" height="7" rx="3.5"></rect>
  <rect class="f-border" x="888" y="442" width="188" height="7" rx="3.5"></rect>
  <rect class="f-secondary" x="888" y="468" width="80" height="22" rx="11"></rect>
  <text class="on-fill" x="928" y="483" text-anchor="middle" font-size="10.5" font-weight="600">Button</text>

  
  <rect class="f-surface s-border" x="618" y="534" width="476" height="34" rx="6"></rect>
  <text class="f-faint" x="634" y="555" font-size="11.5">Components keep stacking until the next Tab component appears.</text>

  
  <rect class="f-surface s-border" x="40" y="708" width="1100" height="48" rx="9"></rect>
  <text class="f-text2" x="62" y="729" font-size="12.5"><tspan font-weight="700">How it works:</tspan> a Tab component marks the start of a tab and carries its label. Everything added after it — until the next Tab component — becomes that tab&#39;s content.</text>
  <text class="f-muted" x="62" y="747" font-size="12.5">The same pattern builds accordions and other grouped, collapsible sections — just swap the wrapper the frontend renders.</text>
</svg>