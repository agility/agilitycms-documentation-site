<svg width="1260" height="610" viewBox="0 0 1260 610" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Editing with an AI assistant: with review or fully automated</title>
<desc id="d">Both lanes start the same way. A person asks, or a scheduled job triggers the agent. The Agility MCP server, or the Management API for unattended jobs, acts with the permissions of its Agility user, and changes are saved to Staging. With review: you review and preview the change in Agility, with approval if your workflow requires it, then you or an approver publish it. If it is not right, you ask the assistant to change it. Fully automated: automated checks run on the staged change, the agent publishes it when they pass, and a webhook logs and notifies on every publish. If something is wrong, unpublish it or restore an earlier version.</desc>
