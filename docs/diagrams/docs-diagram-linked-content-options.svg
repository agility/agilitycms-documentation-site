  <text class="f-muted" x="442" y="616" font-family="ui-monospace, monospace" font-size="11">4</text>
  <text class="f-muted" x="460" y="616" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">SAVE SELECTION TO FIELDS</text>
  <rect class="f-raised" x="442" y="626" width="148" height="28" rx="14"/>
  <rect class="s-bstrong" x="442.5" y="626.5" width="147" height="27" rx="13.5"/>
  <text class="f-text" x="516.0" y="645" text-anchor="middle" font-size="12.5">Save Text to Field</text>
  <rect class="f-raised" x="598.0" y="626" width="155" height="28" rx="14"/>
  <rect class="s-bstrong" x="598.5" y="626.5" width="154" height="27" rx="13.5"/>
  <text class="f-text" x="675.5" y="645" text-anchor="middle" font-size="12.5">Save Value to Field</text>
  <text class="f-muted" x="442" y="672" font-size="12">A checkbox list also sets its column count.</text>

  <!-- Nested -->
