  <text class="f-text" x="526.5" y="505" text-anchor="middle" font-size="12.5">Specific content list</text>
  <rect class="f-raised" x="619.0" y="486" width="127" height="28" rx="14"/>
  <rect class="s-bstrong" x="619.5" y="486.5" width="126" height="27" rx="13.5"/>
  <text class="f-text" x="682.5" y="505" text-anchor="middle" font-size="12.5">User selectable</text>
