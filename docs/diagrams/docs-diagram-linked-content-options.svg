  <rect class="f-raised" x="442" y="626" width="141" height="28" rx="14"/>
  <rect class="s-bstrong" x="442.5" y="626.5" width="140" height="27" rx="13.5"/>
  <text class="f-text" x="512.625" y="645" text-anchor="middle" font-size="12.5">Save Text to Field</text>
  <rect class="f-raised" x="591.25" y="626" width="148" height="28" rx="14"/>
  <rect class="s-bstrong" x="591.75" y="626.5" width="147" height="27" rx="13.5"/>
  <text class="f-text" x="665.1875" y="645" text-anchor="middle" font-size="12.5">Save Value to Field</text>
  <text class="f-muted" x="442" y="672" font-size="12">A checkbox list also sets its column count.</text>

