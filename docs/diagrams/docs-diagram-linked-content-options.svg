  <text class="f-text" x="505.5" y="415" text-anchor="middle" font-size="12.5">Search list box</text>
  <text class="f-muted" x="442" y="442" font-size="12">Dropdown: one item. Checkbox and search: many.</text>
  <text class="f-muted" x="442" y="476" font-family="ui-monospace, monospace" font-size="11">2</text>
  <text class="f-muted" x="460" y="476" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">WHICH LIST?</text>
