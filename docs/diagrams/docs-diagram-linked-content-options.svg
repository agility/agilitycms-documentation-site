  <text class="f-text2" x="600" y="122" text-anchor="middle" font-size="13">Stores a content list's reference name</text>

  <!-- Branches -->
  <path class="s-secondary" d="M560 138 V172 H230 V220" stroke-width="2"/>
  <path class="s-secondary" d="M560 172 H600 V220" stroke-width="2"/>
  <path class="f-secondary" d="M230 230 l-6 -10 h12 z"/>
  <path class="f-secondary" d="M600 230 l-6 -10 h12 z"/>
