  <text class="f-muted" x="206" y="214" font-size="12">the content already exists in a list</text>
  <text class="f-primary" x="820" y="214" font-family="ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="2">NESTED CONTENT</text>
  <text class="f-muted" x="966" y="214" font-size="12">owned by each item</text>

