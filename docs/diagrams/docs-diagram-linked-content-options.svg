<svg width="1200" height="740" viewBox="0 0 1200 740" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Linked Content field options</title>
  <desc id="d">A Linked Content field stores the reference name of a content list. Choose Shared content when the content already exists in a list, or Nested content to create a new list owned by each item. Shared content links either the entire list (choose a specific list or let the editor select one, show an embedded view or a link, pick visible columns, and set the sort to default, by field or manual) or specific items from a list (choose a dropdown list, checkbox list or search list box, choose the list, pick the visible column, and save the selected text and content IDs to fields; a checkbox list also sets a column count). Nested content picks a content model, then a list or a single item; a list can show an embedded view, visible columns and a sort.</desc>
  <!-- Dual-theme, same convention as docs-diagram-headless-architecture.svg: colours live in CSS,
       light is the default, the dark block wins when the page sets color-scheme: dark. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-muted{fill:#5E5951}
    .f-primary{fill:#027970}
    .f-raised{fill:#FEFDF9}
    .f-secondary{fill:#295BAC}
    .f-surface{fill:#FBF9F3}
    .f-tertiary{fill:#FFCB28}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .s-border{stroke:#E4E0D8}
    .s-bstrong{stroke:#CFC9BC}
    .s-primary{stroke:#027970}
    .s-secondary{stroke:#295BAC}
    .s-tertiary{stroke:#FFCB28}
    .s-muted{stroke:#5E5951}
    .on-fill{fill:#FEFDF9}
    .s-onfill{stroke:#FEFDF9}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-muted{fill:#AAA49B}
      .f-primary{fill:#028D83}
      .f-raised{fill:#201F1D}
      .f-secondary{fill:#5989D8}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-primary{stroke:#028D83}
      .s-secondary{stroke:#5989D8}
      .s-tertiary{stroke:#FFCB28}
      .s-muted{stroke:#AAA49B}
      .on-fill{fill:#0E0D0C}
      .s-onfill{stroke:#0E0D0C}
    }
  </style>
