  <rect class="s-bstrong" x="440.5" y="70.5" width="319" height="67" rx="2"/>
  <rect class="f-primary" x="440" y="70" width="320" height="3"/>
  <text class="f-text" x="600" y="100" text-anchor="middle" font-size="17" font-weight="600">Linked Content field</text>
  <text class="f-text2" x="600" y="122" text-anchor="middle" font-size="13">Stores a content list's reference name</text>

  <!-- Branches -->
  <path class="s-secondary" d="M560 138 V160 H420 V186" stroke-width="2"/>
  <path class="f-secondary" d="M420 194 l-6 -10 h12 z"/>
  <path class="s-primary" d="M640 138 V160 H980 V186" stroke-width="2"/>
  <path class="f-primary" d="M980 194 l-6 -10 h12 z"/>

