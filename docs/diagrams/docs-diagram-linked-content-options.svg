  <text class="f-muted" x="460" y="546" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">VISIBLE COLUMN</text>
  <rect class="f-raised" x="442" y="556" width="197" height="28" rx="14"/>
  <rect class="s-bstrong" x="442.5" y="556.5" width="196" height="27" rx="13.5"/>
