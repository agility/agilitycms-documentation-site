<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Dual-theme. Colours live in CSS, not in presentation attributes, so the
       page's color-scheme drives them: the light values are the default and the
       dark block below wins when the embedding page sets color-scheme: dark
       (app/layout.tsx does this alongside the .dark class). Same file, both themes. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-border{fill:#E4E0D8}
    .f-faint{fill:#6E685E}
    .f-muted{fill:#5E5951}
    .f-pdim{fill:#015B54}
    .f-primary{fill:#027970}
    .f-raised{fill:#FEFDF9}
    .f-secondary{fill:#295BAC}
    .f-surface{fill:#FBF9F3}
    .f-tertiary{fill:#FFCB28}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .s-border{stroke:#E4E0D8}
    .s-secondary{stroke:#295BAC}
    .s-tertiary{stroke:#FFCB28}
    .on-teal{fill:#F1EFE9}
    .on-yellow{fill:#0E0D0C}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-border{fill:#302E2B}
      .f-faint{fill:#989289}
      .f-muted{fill:#AAA49B}
      .f-pdim{fill:#026F67}
      .f-primary{fill:#028D83}
      .f-raised{fill:#201F1D}
      .f-secondary{fill:#5989D8}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .s-border{stroke:#302E2B}
      .s-secondary{stroke:#5989D8}
      .s-tertiary{stroke:#FFCB28}
      .on-teal{fill:#F1EFE9}
      .on-yellow{fill:#0E0D0C}
    }
  </style>
  <rect class="f-bg" width="1200" height="640" rx="4"/>
  <rect class="s-border" x="0.5" y="0.5" width="1199" height="639" rx="4"/>

  <text class="f-muted" x="90" y="52" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4">PAGE MANAGEMENT — SITEMAP → PAGE → COMPONENTS</text>

  <!-- Sitemap panel -->
  <rect class="f-surface" x="90" y="84" width="320" height="486" rx="2"/>
  <rect class="s-border" x="90.5" y="84.5" width="319" height="485" rx="2"/>
  <rect class="f-secondary" x="90" y="84" width="320" height="3"/>
  <text class="f-text" x="114" y="126" font-size="17" font-weight="600">Sitemap</text>
  <text class="f-muted" x="114" y="148" font-size="13">Editors own pages and URLs</text>

  <text class="f-text2" x="114" y="196" font-size="15">▸ Home</text>
  <text class="f-text2" x="114" y="232" font-size="15">▸ Products</text>
  <!-- selected node -->
  <rect class="f-pdim" x="126" y="248" width="260" height="34" rx="2"/>
  <text class="on-teal" x="140" y="270" font-size="15" font-weight="600">• Pricing</text>
  <text class="on-teal" x="300" y="270" font-family="ui-monospace, monospace" font-size="11">/pricing</text>
  <text class="f-text2" x="114" y="318" font-size="15">▸ About</text>
  <text class="f-text2" x="114" y="354" font-size="15">▸ Blog</text>
  <text class="f-faint" x="132" y="390" font-size="13">▸ posts/{slug} — dynamic</text>

  <rect class="f-border" x="114" y="428" width="270" height="1"/>
  <text class="f-muted" x="114" y="462" font-size="13">＋ New page, new URL, reorder,</text>
  <text class="f-muted" x="129" y="482" font-size="13">redirect — no developer ticket.</text>
  <rect class="f-tertiary" x="114" y="506" width="120" height="30" rx="2"/>
  <text class="on-yellow" x="132" y="526" font-size="13" font-weight="700">＋ New Page</text>

  <!-- connector -->
  <path class="s-secondary" d="M410 265 L500 265" stroke-width="2"/>
  <path class="f-secondary" d="M500 265 l-10 -6 v12 z"/>

  <!-- Page panel -->
  <rect class="f-surface" x="500" y="84" width="610" height="486" rx="2"/>
  <rect class="s-border" x="500.5" y="84.5" width="609" height="485" rx="2"/>
  <rect class="f-primary" x="500" y="84" width="610" height="3"/>
  <text class="f-text" x="524" y="126" font-size="17" font-weight="600">Page — /pricing</text>
  <text class="f-muted" x="524" y="148" font-size="13">Composed from components developers built</text>

  <!-- component stack -->
  <g>
    <rect class="f-raised" x="524" y="176" width="560" height="72" rx="2"/>
    <rect class="f-secondary" x="524" y="176" width="4" height="72"/>
    <circle class="f-faint" cx="552" cy="206" r="2"/><circle class="f-faint" cx="552" cy="214" r="2"/>
    <circle class="f-faint" cx="560" cy="206" r="2"/><circle class="f-faint" cx="560" cy="214" r="2"/>
    <text class="f-text" x="584" y="208" font-size="15" font-weight="600">Hero</text>
    <text class="f-faint" x="584" y="228" font-family="ui-monospace, monospace" font-size="11">PageHero</text>
  </g>
  <g>
    <rect class="f-raised" x="524" y="264" width="560" height="72" rx="2"/>
    <rect class="f-primary" x="524" y="264" width="4" height="72"/>
    <circle class="f-faint" cx="552" cy="294" r="2"/><circle class="f-faint" cx="552" cy="302" r="2"/>
    <circle class="f-faint" cx="560" cy="294" r="2"/><circle class="f-faint" cx="560" cy="302" r="2"/>
    <text class="f-text" x="584" y="296" font-size="15" font-weight="600">Feature Grid</text>
    <text class="f-faint" x="584" y="316" font-family="ui-monospace, monospace" font-size="11">FeatureCardGroup</text>
  </g>
  <!-- dragging component -->
  <g transform="translate(24 0)">
    <rect class="f-raised s-tertiary" x="524" y="352" width="560" height="72" rx="2" stroke-dasharray="5 4"/>
    <rect class="f-tertiary" x="524" y="352" width="4" height="72"/>
    <circle class="f-muted" cx="552" cy="382" r="2"/><circle class="f-muted" cx="552" cy="390" r="2"/>
    <circle class="f-muted" cx="560" cy="382" r="2"/><circle class="f-muted" cx="560" cy="390" r="2"/>
    <text class="f-text" x="584" y="384" font-size="15" font-weight="600">Pricing Table</text>
    <text class="f-faint" x="584" y="404" font-family="ui-monospace, monospace" font-size="11">PricingTable — dragging…</text>
  </g>
  <g>
    <rect class="f-raised" x="524" y="440" width="560" height="72" rx="2"/>
    <rect class="f-primary" x="524" y="440" width="4" height="72"/>
    <circle class="f-faint" cx="552" cy="470" r="2"/><circle class="f-faint" cx="552" cy="478" r="2"/>
    <circle class="f-faint" cx="560" cy="470" r="2"/><circle class="f-faint" cx="560" cy="478" r="2"/>
    <text class="f-text" x="584" y="472" font-size="15" font-weight="600">Call to Action</text>
    <text class="f-faint" x="584" y="492" font-family="ui-monospace, monospace" font-size="11">CTABanner</text>
  </g>

  <text class="f-muted" x="524" y="546" font-size="13">Add, reorder, and configure components per page — the layout stays in the CMS.</text>

  <text class="f-faint" x="90" y="606" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">AGILITY CMS · PAGE MANAGEMENT</text>
</svg>
