<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Dual-theme. Colours live in CSS, not in presentation attributes, so the
       page's color-scheme drives them: the light values are the default and the
       dark block below wins when the embedding page sets color-scheme: dark
       (app/layout.tsx does this alongside the .dark class). Same file, both themes. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-border{fill:#E4E0D8}
    .f-bstrong{fill:#CFC9BC}
    .f-err{fill:#C0362F}
    .f-faint{fill:#6E685E}
    .f-muted{fill:#5E5951}
    .f-ok{fill:#1A6E36}
    .f-pdim{fill:#015B54}
    .f-primary{fill:#027970}
    .f-raised{fill:#FEFDF9}
    .f-secondary{fill:#295BAC}
    .f-surface{fill:#FBF9F3}
    .f-tertiary{fill:#FFCB28}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .s-border{stroke:#E4E0D8}
    .s-primary{stroke:#027970}
    .s-secondary{stroke:#295BAC}
    .on-primary{fill:#FFFFFF}
    .on-teal{fill:#F1EFE9}
    .on-yellow{fill:#0E0D0C}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-border{fill:#302E2B}
      .f-bstrong{fill:#45423E}
      .f-err{fill:#F26A6E}
      .f-faint{fill:#989289}
      .f-muted{fill:#AAA49B}
      .f-ok{fill:#79C06B}
      .f-pdim{fill:#026F67}
      .f-primary{fill:#028D83}
      .f-raised{fill:#201F1D}
      .f-secondary{fill:#5989D8}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .s-border{stroke:#302E2B}
      .s-primary{stroke:#028D83}
      .s-secondary{stroke:#5989D8}
      .on-primary{fill:#0E0D0C}
      .on-teal{fill:#F1EFE9}
      .on-yellow{fill:#0E0D0C}
    }
  </style>
  <rect class="f-bg" width="1200" height="640" rx="4"/>
  <rect class="s-border" x="0.5" y="0.5" width="1199" height="639" rx="4"/>

  <!-- eyebrow -->
  <text class="f-muted" x="90" y="52" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4">WEB STUDIO — YOUR SITE, INSIDE AGILITY</text>

  <!-- Browser frame -->
  <rect class="f-surface" x="90" y="84" width="690" height="486" rx="2"/>
  <rect class="s-border" x="90.5" y="84.5" width="689" height="485" rx="2"/>
  <!-- browser top bar -->
  <rect class="f-raised" x="90" y="84" width="690" height="44" rx="2"/>
  <circle class="f-err" cx="118" cy="106" r="6"/>
  <circle class="f-tertiary" cx="140" cy="106" r="6"/>
  <circle class="f-ok" cx="162" cy="106" r="6"/>
  <rect class="f-bg" x="190" y="94" width="380" height="24" rx="2"/>
  <text class="f-muted" x="204" y="110" font-family="ui-monospace, monospace" font-size="12">agilitycms.com — staging preview</text>
  <rect class="f-pdim" x="586" y="94" width="90" height="24" rx="2"/>
  <text class="on-teal" x="600" y="110" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">PREVIEW</text>

  <!-- mini site inside frame -->
  <rect class="f-raised" x="122" y="156" width="626" height="52" rx="2"/>
  <rect class="f-bstrong" x="138" y="174" width="90" height="14" rx="2"/>
  <rect class="f-tertiary" x="560" y="174" width="70" height="16" rx="2"/>

  <!-- hero block with teal accent bar -->
  <rect class="f-surface" x="122" y="224" width="626" height="130" rx="2"/>
  <rect class="s-border" x="122.5" y="224.5" width="625" height="129" rx="2"/>
  <rect class="f-primary" x="122" y="224" width="626" height="3"/>
  <rect class="f-text2" x="146" y="252" width="300" height="18" rx="2"/>
  <rect class="f-bstrong" x="146" y="282" width="420" height="10" rx="2"/>
  <rect class="f-border" x="146" y="300" width="360" height="10" rx="2"/>

  <!-- two cards -->
  <rect class="f-surface" x="122" y="378" width="300" height="150" rx="2"/>
  <rect class="s-border" x="122.5" y="378.5" width="299" height="149" rx="2"/>
  <rect class="f-secondary" x="122" y="378" width="300" height="3"/>
  <rect class="f-text2" x="146" y="404" width="140" height="12" rx="2"/>
  <rect class="f-bstrong" x="146" y="428" width="240" height="8" rx="2"/>
  <rect class="f-border" x="146" y="444" width="200" height="8" rx="2"/>

  <rect class="f-surface" x="448" y="378" width="300" height="150" rx="2"/>
  <rect class="s-border" x="448.5" y="378.5" width="299" height="149" rx="2"/>
  <rect class="f-tertiary" x="448" y="378" width="300" height="3"/>
  <rect class="f-text2" x="472" y="404" width="140" height="12" rx="2"/>
  <rect class="f-bstrong" x="472" y="428" width="240" height="8" rx="2"/>
  <rect class="f-border" x="472" y="444" width="200" height="8" rx="2"/>

  <!-- comment bubble pinned to hero -->
  <circle class="f-primary" cx="586" cy="268" r="17"/>
  <text class="on-primary" x="586" y="274" text-anchor="middle" font-size="15" font-weight="700">2</text>
  <path class="s-primary" d="M594 281 L604 295" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- right rail: capabilities -->
  <g>
    <rect class="f-surface" x="830" y="84" width="280" height="106" rx="2"/>
    <rect class="s-border" x="830.5" y="84.5" width="279" height="105" rx="2"/>
    <rect class="f-primary" x="830" y="84" width="280" height="3"/>
    <text class="f-text" x="854" y="122" font-size="17" font-weight="600">Preview ⇄ Production</text>
    <text class="f-muted" x="854" y="148" font-size="13">Compare staging against live,</text>
    <text class="f-muted" x="854" y="166" font-size="13">side by side, in product.</text>
  </g>
  <g>
    <rect class="f-surface" x="830" y="212" width="280" height="106" rx="2"/>
    <rect class="s-border" x="830.5" y="212.5" width="279" height="105" rx="2"/>
    <rect class="f-secondary" x="830" y="212" width="280" height="3"/>
    <text class="f-text" x="854" y="250" font-size="17" font-weight="600">Every screen size</text>
    <rect class="s-secondary" x="854" y="268" width="34" height="24" rx="2" fill="none"/>
    <rect class="s-secondary" x="898" y="272" width="20" height="20" rx="2" fill="none"/>
    <rect class="s-secondary" x="928" y="276" width="12" height="16" rx="2" fill="none"/>
    <text class="f-muted" x="958" y="288" font-size="13">virtual viewports</text>
  </g>
  <g>
    <rect class="f-surface" x="830" y="340" width="280" height="106" rx="2"/>
    <rect class="s-border" x="830.5" y="340.5" width="279" height="105" rx="2"/>
    <rect class="f-primary" x="830" y="340" width="280" height="3"/>
    <text class="f-text" x="854" y="378" font-size="17" font-weight="600">Live commenting</text>
    <text class="f-muted" x="854" y="404" font-size="13">Threads and mentions pinned</text>
    <text class="f-muted" x="854" y="422" font-size="13">to elements in the preview.</text>
  </g>
  <g>
    <rect class="f-tertiary" x="830" y="468" width="280" height="102" rx="2"/>
    <text class="on-yellow" x="854" y="510" font-size="17" font-weight="700">Edit in context ✎</text>
    <text class="on-yellow" x="854" y="536" font-size="13">Click any component and edit it</text>
    <text class="on-yellow" x="854" y="554" font-size="13">on the real layout. No code.</text>
  </g>

  <!-- footer caption -->
  <text class="f-faint" x="90" y="606" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">AGILITY CMS · WEB STUDIO</text>
</svg>
