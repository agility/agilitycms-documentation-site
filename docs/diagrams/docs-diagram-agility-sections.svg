<svg width="1000" height="580" viewBox="0 0 1000 580" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The four main sections of Agility CMS</title>
  <desc id="d">Agility CMS is organized into four sections. Content holds content lists and items, such as blog posts, authors and categories. Assets holds files, images and PDFs in the media library. Pages holds the sitemap, pages and the components placed on them. Web Studio is where you preview pages before you publish. A typical workflow moves from Assets to Content to Pages to Web Studio.</desc>
  <!-- Dual-theme, same convention as docs-diagram-headless-architecture.svg. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-muted{fill:#5E5951}
    .f-primary{fill:#027970}
    .f-raised{fill:#FEFDF9}
    .f-secondary{fill:#295BAC}
    .f-surface{fill:#FBF9F3}
    .f-tertiary{fill:#FFCB28}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .s-border{stroke:#E4E0D8}
    .s-bstrong{stroke:#CFC9BC}
    .s-primary{stroke:#027970}
    .s-secondary{stroke:#295BAC}
    .s-muted{stroke:#5E5951}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-muted{fill:#AAA49B}
      .f-primary{fill:#028D83}
      .f-raised{fill:#201F1D}
      .f-secondary{fill:#5989D8}
      .f-surface{fill:#171615}
      .f-tertiary{fill:#FFCB28}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-primary{stroke:#028D83}
      .s-secondary{stroke:#5989D8}
      .s-muted{stroke:#AAA49B}
    }
  </style>
  <rect class="f-bg" width="1000" height="580" rx="4"/>
  <rect class="s-border" x="0.5" y="0.5" width="999" height="579" rx="4"/>

  <text class="f-muted" x="60" y="44" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4">AGILITY CMS SECTIONS: WHAT EACH ONE HOLDS</text>

  <!-- Content -->
  <rect class="f-surface" x="60" y="80" width="320" height="84" rx="2"/>
  <rect class="s-bstrong" x="60.5" y="80.5" width="319" height="83" rx="2"/>
  <rect class="f-primary" x="60" y="80" width="320" height="3"/>
  <text class="f-text" x="84" y="118" font-size="18" font-weight="600">Content</text>
  <text class="f-text2" x="84" y="141" font-size="13">Reusable content</text>
  <path class="s-primary" d="M380 122 H532" stroke-width="2"/>
  <path class="f-primary" d="M540 122 l-10 -6 v12 z"/>
  <text class="f-muted" x="460" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">HOLDS</text>
  <rect class="f-raised" x="540" y="80" width="400" height="84" rx="2"/>
  <rect class="s-border" x="540.5" y="80.5" width="399" height="83" rx="2"/>
  <rect class="f-secondary" x="540" y="80" width="3" height="84"/>
  <text class="f-text" x="564" y="118" font-size="16" font-weight="600">Content lists and items</text>
  <text class="f-text2" x="564" y="141" font-size="13">Blog posts, authors, categories</text>
  <!-- Assets -->
  <rect class="f-surface" x="60" y="184" width="320" height="84" rx="2"/>
  <rect class="s-bstrong" x="60.5" y="184.5" width="319" height="83" rx="2"/>
  <rect class="f-primary" x="60" y="184" width="320" height="3"/>
  <text class="f-text" x="84" y="222" font-size="18" font-weight="600">Assets</text>
  <text class="f-text2" x="84" y="245" font-size="13">Media library</text>
  <path class="s-primary" d="M380 226 H532" stroke-width="2"/>
  <path class="f-primary" d="M540 226 l-10 -6 v12 z"/>
  <text class="f-muted" x="460" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">HOLDS</text>
  <rect class="f-raised" x="540" y="184" width="400" height="84" rx="2"/>
  <rect class="s-border" x="540.5" y="184.5" width="399" height="83" rx="2"/>
  <rect class="f-secondary" x="540" y="184" width="3" height="84"/>
  <text class="f-text" x="564" y="222" font-size="16" font-weight="600">Files, images and PDFs</text>
  <text class="f-text2" x="564" y="245" font-size="13">Served through the Asset CDN</text>
  <!-- Pages -->
  <rect class="f-surface" x="60" y="288" width="320" height="84" rx="2"/>
  <rect class="s-bstrong" x="60.5" y="288.5" width="319" height="83" rx="2"/>
  <rect class="f-primary" x="60" y="288" width="320" height="3"/>
  <text class="f-text" x="84" y="326" font-size="18" font-weight="600">Pages</text>
  <text class="f-text2" x="84" y="349" font-size="13">Site structure</text>
  <path class="s-primary" d="M380 330 H532" stroke-width="2"/>
  <path class="f-primary" d="M540 330 l-10 -6 v12 z"/>
  <text class="f-muted" x="460" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">HOLDS</text>
  <rect class="f-raised" x="540" y="288" width="400" height="84" rx="2"/>
  <rect class="s-border" x="540.5" y="288.5" width="399" height="83" rx="2"/>
  <rect class="f-secondary" x="540" y="288" width="3" height="84"/>
  <text class="f-text" x="564" y="326" font-size="16" font-weight="600">Sitemap, pages and components</text>
  <text class="f-text2" x="564" y="349" font-size="13">Components placed in content zones</text>
  <!-- Web Studio -->
  <rect class="f-surface" x="60" y="392" width="320" height="84" rx="2"/>
  <rect class="s-bstrong" x="60.5" y="392.5" width="319" height="83" rx="2"/>
  <rect class="f-primary" x="60" y="392" width="320" height="3"/>
  <text class="f-text" x="84" y="430" font-size="18" font-weight="600">Web Studio</text>
  <text class="f-text2" x="84" y="453" font-size="13">Preview before publishing</text>
  <path class="s-primary" d="M380 434 H532" stroke-width="2"/>
  <path class="f-primary" d="M540 434 l-10 -6 v12 z"/>
  <text class="f-muted" x="460" y="424" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">HOLDS</text>
  <rect class="f-raised" x="540" y="392" width="400" height="84" rx="2"/>
  <rect class="s-border" x="540.5" y="392.5" width="399" height="83" rx="2"/>
  <rect class="f-secondary" x="540" y="392" width="3" height="84"/>
  <text class="f-text" x="564" y="430" font-size="16" font-weight="600">Preview of your pages</text>
  <text class="f-text2" x="564" y="453" font-size="13">See how everything comes together</text>
  <!-- Typical workflow -->
  <text class="f-muted" x="60" y="530" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">TYPICAL WORKFLOW</text>
  <text class="f-text2" x="60" y="552" font-size="13">Upload assets → create content items → build pages from components → preview in Web Studio</text>
</svg>
