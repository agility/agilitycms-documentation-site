<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">The named color field, listing the CSS named colors ordered by appearance</title>
  <desc id="d">An Accent color field set to teal (#008080) with a search box and a grid of named color swatches, greys first and then walking the spectrum, with teal selected. A caption notes that all 148 CSS named colors are ordered by appearance. The swatches show real colours and stay the same in both themes.</desc>
  <!-- Dual-theme (docs convention): colours live in CSS, light is the default,
       the dark block wins when the page sets color-scheme: dark. -->
  <style>
    .f-bg{fill:#F1EFE9}
    .f-faint{fill:#6E685E}
    .f-lit-000000{fill:#000000}
    .f-lit-000080{fill:#000080}
    .f-lit-008080{fill:#008080}
    .f-lit-00bfff{fill:#00BFFF}
    .f-lit-2e8b57{fill:#2E8B57}
    .f-lit-32cd32{fill:#32CD32}
    .f-lit-40e0d0{fill:#40E0D0}
    .f-lit-4169e1{fill:#4169E1}
    .f-lit-4682b4{fill:#4682B4}
    .f-lit-808080{fill:#808080}
    .f-lit-9acd32{fill:#9ACD32}
    .f-lit-c0c0c0{fill:#C0C0C0}
    .f-lit-da70d6{fill:#DA70D6}
    .f-lit-dc143c{fill:#DC143C}
    .f-lit-dcdcdc{fill:#DCDCDC}
    .f-lit-f0e68c{fill:#F0E68C}
    .f-lit-f5deb3{fill:#F5DEB3}
    .f-lit-f5f5f5{fill:#F5F5F5}
    .f-lit-ff6347{fill:#FF6347}
    .f-lit-ff69b4{fill:#FF69B4}
    .f-lit-ff7f50{fill:#FF7F50}
    .f-lit-ffa500{fill:#FFA500}
    .f-lit-ffd700{fill:#FFD700}
    .f-lit-ffffff{fill:#FFFFFF}
    .f-muted{fill:#5E5951}
    .f-raised{fill:#FEFDF9}
    .f-text{fill:#181716}
    .f-text2{fill:#3B3935}
    .s-border{stroke:#E4E0D8}
    .s-bstrong{stroke:#CFC9BC}
    .s-text{stroke:#181716}
    @media (prefers-color-scheme: dark) {
      .f-bg{fill:#0E0D0C}
      .f-faint{fill:#989289}
      .f-muted{fill:#AAA49B}
      .f-raised{fill:#201F1D}
      .f-text{fill:#F1EFE9}
      .f-text2{fill:#C4BFB5}
      .s-border{stroke:#302E2B}
      .s-bstrong{stroke:#45423E}
      .s-text{stroke:#F1EFE9}
    }
  </style>
  <!-- Named-colour swatches are the content: they keep literal values in both themes. -->

	<style>
		.ui { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif; }
		.nm { font-size: 19px; }
	</style>

	<rect class="f-bg" width="1600" height="1000" />
	<rect class="f-raised s-border" x="420" y="80" width="760" height="840" rx="20" stroke-width="2" />

	<g class="ui">
		<text class="f-text2" x="460" y="152" font-size="24" font-weight="500">Accent color</text>

		<rect class="f-raised s-border" x="460" y="172" width="680" height="640" rx="16" stroke-width="2" />

		<!-- the collapsed row -->
		<rect class="f-lit-008080 s-bstrong" x="484" y="196" width="72" height="72" rx="10" stroke-width="2" />
		<text class="f-text" x="578" y="226" font-size="29" font-weight="500">teal</text>
		<text class="f-muted" x="578" y="256" font-size="22">#008080</text>

		<text class="f-muted" x="1000" y="241" font-size="24" font-weight="500" text-anchor="middle">Clear</text>
		<rect class="f-raised s-bstrong" x="1040" y="206" width="80" height="52" rx="10" stroke-width="2" />
		<text class="f-text2" x="1080" y="241" font-size="24" font-weight="500" text-anchor="middle">Done</text>

		<line class="s-border" x1="460" y1="292" x2="1140" y2="292" stroke-width="2" />

		<!-- search -->
		<rect class="f-raised s-bstrong" x="484" y="316" width="632" height="60" rx="10" stroke-width="2" />
		<text class="f-faint" x="506" y="354" font-size="24">Search color names…</text>

		<!-- the grid, greys first then walking the spectrum, as the field orders them -->
		<g>
			<!-- row 1 -->
			<rect class="f-lit-ffffff s-border" x="484" y="408" width="97" height="56" rx="8" stroke-width="2" />
			<text x="532" y="486" class="nm f-muted" text-anchor="middle">white</text>
			<rect class="f-lit-f5f5f5" x="591" y="408" width="97" height="56" rx="8" />
			<text x="639" y="486" class="nm f-muted" text-anchor="middle">whitesmoke</text>
			<rect class="f-lit-dcdcdc" x="698" y="408" width="97" height="56" rx="8" />
			<text x="746" y="486" class="nm f-muted" text-anchor="middle">gainsboro</text>
			<rect class="f-lit-c0c0c0" x="805" y="408" width="97" height="56" rx="8" />
			<text x="853" y="486" class="nm f-muted" text-anchor="middle">silver</text>
			<rect class="f-lit-808080" x="912" y="408" width="97" height="56" rx="8" />
			<text x="960" y="486" class="nm f-muted" text-anchor="middle">gray</text>
			<rect class="f-lit-000000" x="1019" y="408" width="97" height="56" rx="8" />
			<text x="1067" y="486" class="nm f-muted" text-anchor="middle">black</text>

			<!-- row 2 -->
			<rect class="f-lit-dc143c" x="484" y="504" width="97" height="56" rx="8" />
			<text x="532" y="582" class="nm f-muted" text-anchor="middle">crimson</text>
			<rect class="f-lit-ff6347" x="591" y="504" width="97" height="56" rx="8" />
			<text x="639" y="582" class="nm f-muted" text-anchor="middle">tomato</text>
			<rect class="f-lit-ff7f50" x="698" y="504" width="97" height="56" rx="8" />
			<text x="746" y="582" class="nm f-muted" text-anchor="middle">coral</text>
			<rect class="f-lit-ffa500" x="805" y="504" width="97" height="56" rx="8" />
			<text x="853" y="582" class="nm f-muted" text-anchor="middle">orange</text>
			<rect class="f-lit-ffd700" x="912" y="504" width="97" height="56" rx="8" />
			<text x="960" y="582" class="nm f-muted" text-anchor="middle">gold</text>
			<rect class="f-lit-f0e68c" x="1019" y="504" width="97" height="56" rx="8" />
			<text x="1067" y="582" class="nm f-muted" text-anchor="middle">khaki</text>

			<!-- row 3 -->
			<rect class="f-lit-9acd32" x="484" y="600" width="97" height="56" rx="8" />
			<text x="532" y="678" class="nm f-muted" text-anchor="middle">yellowgreen</text>
			<rect class="f-lit-32cd32" x="591" y="600" width="97" height="56" rx="8" />
			<text x="639" y="678" class="nm f-muted" text-anchor="middle">limegreen</text>
			<rect class="f-lit-2e8b57" x="698" y="600" width="97" height="56" rx="8" />
			<text x="746" y="678" class="nm f-muted" text-anchor="middle">seagreen</text>

			<!-- the selection -->
			<rect class="f-raised s-text" x="801" y="596" width="105" height="64" rx="10" stroke-width="3" />
			<rect class="f-lit-008080" x="809" y="604" width="89" height="48" rx="6" />
			<text x="853" y="678" class="nm f-text" font-weight="600" text-anchor="middle">teal</text>

			<rect class="f-lit-40e0d0" x="912" y="600" width="97" height="56" rx="8" />
			<text x="960" y="678" class="nm f-muted" text-anchor="middle">turquoise</text>
			<rect class="f-lit-00bfff" x="1019" y="600" width="97" height="56" rx="8" />
			<text x="1067" y="678" class="nm f-muted" text-anchor="middle">deepskyblue</text>

			<!-- row 4 -->
			<rect class="f-lit-4682b4" x="484" y="696" width="97" height="56" rx="8" />
			<text x="532" y="774" class="nm f-muted" text-anchor="middle">steelblue</text>
			<rect class="f-lit-4169e1" x="591" y="696" width="97" height="56" rx="8" />
			<text x="639" y="774" class="nm f-muted" text-anchor="middle">royalblue</text>
			<rect class="f-lit-000080" x="698" y="696" width="97" height="56" rx="8" />
			<text x="746" y="774" class="nm f-muted" text-anchor="middle">navy</text>
			<rect class="f-lit-da70d6" x="805" y="696" width="97" height="56" rx="8" />
			<text x="853" y="774" class="nm f-muted" text-anchor="middle">orchid</text>
			<rect class="f-lit-ff69b4" x="912" y="696" width="97" height="56" rx="8" />
			<text x="960" y="774" class="nm f-muted" text-anchor="middle">hotpink</text>
			<rect class="f-lit-f5deb3" x="1019" y="696" width="97" height="56" rx="8" />
			<text x="1067" y="774" class="nm f-muted" text-anchor="middle">wheat</text>
		</g>
	</g>

	<text x="800" y="868" class="ui f-muted" font-size="25" text-anchor="middle">
		All 148 CSS named colors, ordered by appearance so the blues sit together.
	</text>
</svg>
