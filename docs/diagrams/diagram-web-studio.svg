<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Ocean dark panel: n-900 base, works on light and dark pages -->
  <rect width="1200" height="640" rx="4" fill="#181716"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="4" stroke="#3B3935"/>

  <!-- eyebrow -->
  <text x="90" y="52" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#AAA49B">WEB STUDIO — YOUR SITE, INSIDE AGILITY</text>

  <!-- Browser frame -->
  <rect x="90" y="84" width="690" height="486" rx="2" fill="#1F1E1C"/>
  <rect x="90.5" y="84.5" width="689" height="485" rx="2" stroke="#3B3935"/>
  <!-- browser top bar -->
  <rect x="90" y="84" width="690" height="44" rx="2" fill="#2A2826"/>
  <circle cx="118" cy="106" r="6" fill="#F26A6E"/>
  <circle cx="140" cy="106" r="6" fill="#FFC414"/>
  <circle cx="162" cy="106" r="6" fill="#79C06B"/>
  <rect x="190" y="94" width="380" height="24" rx="2" fill="#181716"/>
  <text x="204" y="110" font-family="ui-monospace, monospace" font-size="12" fill="#AAA49B">agilitycms.com — staging preview</text>
  <rect x="586" y="94" width="90" height="24" rx="2" fill="#0B5C66"/>
  <text x="600" y="110" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1" fill="#F1EFE9">PREVIEW</text>

  <!-- mini site inside frame -->
  <rect x="122" y="156" width="626" height="52" rx="2" fill="#2A2826"/>
  <rect x="138" y="174" width="90" height="14" rx="2" fill="#504D49"/>
  <rect x="560" y="174" width="70" height="16" rx="2" fill="#FFC414"/>

  <!-- hero block with teal accent bar -->
  <rect x="122" y="224" width="626" height="130" rx="2" fill="#1F1E1C"/>
  <rect x="122.5" y="224.5" width="625" height="129" rx="2" stroke="#3B3935"/>
  <rect x="122" y="224" width="626" height="3" fill="#3EB4C2"/>
  <rect x="146" y="252" width="300" height="18" rx="2" fill="#C4BFB5"/>
  <rect x="146" y="282" width="420" height="10" rx="2" fill="#504D49"/>
  <rect x="146" y="300" width="360" height="10" rx="2" fill="#3B3935"/>

  <!-- two cards -->
  <rect x="122" y="378" width="300" height="150" rx="2" fill="#1F1E1C"/>
  <rect x="122.5" y="378.5" width="299" height="149" rx="2" stroke="#3B3935"/>
  <rect x="122" y="378" width="300" height="3" fill="#83A9F4"/>
  <rect x="146" y="404" width="140" height="12" rx="2" fill="#C4BFB5"/>
  <rect x="146" y="428" width="240" height="8" rx="2" fill="#504D49"/>
  <rect x="146" y="444" width="200" height="8" rx="2" fill="#3B3935"/>

  <rect x="448" y="378" width="300" height="150" rx="2" fill="#1F1E1C"/>
  <rect x="448.5" y="378.5" width="299" height="149" rx="2" stroke="#3B3935"/>
  <rect x="448" y="378" width="300" height="3" fill="#FFC414"/>
  <rect x="472" y="404" width="140" height="12" rx="2" fill="#C4BFB5"/>
  <rect x="472" y="428" width="240" height="8" rx="2" fill="#504D49"/>
  <rect x="472" y="444" width="200" height="8" rx="2" fill="#3B3935"/>

  <!-- comment bubble pinned to hero -->
  <circle cx="586" cy="268" r="17" fill="#3EB4C2"/>
  <text x="586" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0D0C">2</text>
  <path d="M594 281 L604 295" stroke="#3EB4C2" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- right rail: capabilities -->
  <g>
    <rect x="830" y="84" width="280" height="106" rx="2" fill="#1F1E1C"/>
    <rect x="830.5" y="84.5" width="279" height="105" rx="2" stroke="#3B3935"/>
    <rect x="830" y="84" width="280" height="3" fill="#3EB4C2"/>
    <text x="854" y="122" font-size="17" font-weight="600" fill="#F1EFE9">Preview ⇄ Production</text>
    <text x="854" y="148" font-size="13" fill="#AAA49B">Compare staging against live,</text>
    <text x="854" y="166" font-size="13" fill="#AAA49B">side by side, in product.</text>
  </g>
  <g>
    <rect x="830" y="212" width="280" height="106" rx="2" fill="#1F1E1C"/>
    <rect x="830.5" y="212.5" width="279" height="105" rx="2" stroke="#3B3935"/>
    <rect x="830" y="212" width="280" height="3" fill="#83A9F4"/>
    <text x="854" y="250" font-size="17" font-weight="600" fill="#F1EFE9">Every screen size</text>
    <rect x="854" y="268" width="34" height="24" rx="2" stroke="#83A9F4" fill="none"/>
    <rect x="898" y="272" width="20" height="20" rx="2" stroke="#83A9F4" fill="none"/>
    <rect x="928" y="276" width="12" height="16" rx="2" stroke="#83A9F4" fill="none"/>
    <text x="958" y="288" font-size="13" fill="#AAA49B">virtual viewports</text>
  </g>
  <g>
    <rect x="830" y="340" width="280" height="106" rx="2" fill="#1F1E1C"/>
    <rect x="830.5" y="340.5" width="279" height="105" rx="2" stroke="#3B3935"/>
    <rect x="830" y="340" width="280" height="3" fill="#3EB4C2"/>
    <text x="854" y="378" font-size="17" font-weight="600" fill="#F1EFE9">Live commenting</text>
    <text x="854" y="404" font-size="13" fill="#AAA49B">Threads and mentions pinned</text>
    <text x="854" y="422" font-size="13" fill="#AAA49B">to elements in the preview.</text>
  </g>
  <g>
    <rect x="830" y="468" width="280" height="102" rx="2" fill="#FFC414"/>
    <text x="854" y="510" font-size="17" font-weight="700" fill="#0E0D0C">Edit in context ✎</text>
    <text x="854" y="536" font-size="13" fill="#0E0D0C">Click any component and edit it</text>
    <text x="854" y="554" font-size="13" fill="#0E0D0C">on the real layout. No code.</text>
  </g>

  <!-- footer caption -->
  <text x="90" y="606" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#76716B">AGILITY CMS · WEB STUDIO</text>
</svg>
